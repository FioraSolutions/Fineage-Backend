# Local Fineage foundation: the only account store is PostgreSQL.
services:
  postgres:
    image: postgres:16-alpine
    container_name: fineage-postgres
    environment:
      POSTGRES_USER: fineage
      POSTGRES_PASSWORD: fineage
      POSTGRES_DB: fineage
    ports:
      - "5432:5432"
    volumes:
      - fineage_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fineage -d fineage"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  fineage_pg:
