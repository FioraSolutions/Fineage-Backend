# Local Prometheus + Grafana for a Fineage Login/Zone running on this host (#992). Nothing here is deployed by CI.
#   docker compose -f monitoring/docker-compose.yml up -d
#   Prometheus http://127.0.0.1:9090, Grafana http://127.0.0.1:3000 (admin / admin on first login)
# Host networking lets Prometheus reach the loopback metrics ports (FINEAGE_METRICS_BIND=127.0.0.1).
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=20GB
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana:12.1.0
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards/fineage:ro
      - grafana-data:/var/lib/grafana
volumes:
  prometheus-data:
  grafana-data:
