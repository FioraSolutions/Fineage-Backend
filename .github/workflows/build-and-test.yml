name: build-and-test

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [main, dev]
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FAST_TEST_FILTER: 'Category!=Slow&Category!=Integration&Category!=Load&Category!=perf'

jobs:
  fast-unit-tests:
    name: unit-${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: agent
            project: tests/Fineage.Agent.Contracts.Tests/Fineage.Agent.Contracts.Tests.csproj
          - id: agent-identity
            project: tests/Fineage.Agent.Identity.Tests/Fineage.Agent.Identity.Tests.csproj
          - id: agent-observation
            project: tests/Fineage.Agent.Observation.Tests/Fineage.Agent.Observation.Tests.csproj
          - id: agent-gate
            project: tests/Fineage.Agent.Gate.Tests/Fineage.Agent.Gate.Tests.csproj
          - id: game
            project: tests/Fineage.Game.Tests/Fineage.Game.Tests.csproj
          - id: net
            project: tests/Fineage.Net.Tests/Fineage.Net.Tests.csproj
          - id: login
            project: tests/Fineage.Login.Tests/Fineage.Login.Tests.csproj
          - id: zone
            project: tests/Fineage.Zone.Tests/Fineage.Zone.Tests.csproj
          - id: mobiusdiff
            project: tests/Fineage.MobiusDiff.Tests/Fineage.MobiusDiff.Tests.csproj
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Fineage.Backend.slnx

      - name: Restore and build
        run: dotnet build ${{ matrix.project }} --configuration Release

      - name: Fast unit tests
        run: >-
          dotnet test ${{ matrix.project }}
          --configuration Release
          --no-build
          --verbosity minimal
          --filter "${{ env.FAST_TEST_FILTER }}"

  integration-tests:
    name: integration-postgres
    if: >-
      ${{ github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.base_ref == 'main') ||
          (github.event_name == 'pull_request' && github.base_ref == 'dev' &&
            contains(github.event.pull_request.labels.*.name, 'perf')) }}
    uses: ./.github/workflows/dotnet-test-with-postgres.yml

  zone-simulation-perf:
    name: zone-simulation-perf
    if: >-
      ${{ github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.base_ref == 'main') ||
          (github.event_name == 'pull_request' && github.base_ref == 'dev' &&
            contains(github.event.pull_request.labels.*.name, 'perf')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Fineage.Backend.slnx

      - name: Zone simulation perf tests
        run: dotnet test tests/Fineage.Zone.Tests/Fineage.Zone.Tests.csproj --configuration Release --verbosity normal --filter "Category=perf" -- xUnit.ParallelizeTestCollections=false

  zone-parallel-regions:
    name: zone-parallel-regions
    if: >-
      ${{ github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.base_ref == 'main') ||
          (github.event_name == 'pull_request' && github.base_ref == 'dev' &&
            contains(github.event.pull_request.labels.*.name, 'perf')) }}
    runs-on: ubuntu-latest
    env:
      FINEAGE_ZONE_REGION_WORKERS: '4'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Fineage.Backend.slnx

      - name: Zone parallel region tests
        run: dotnet test tests/Fineage.Zone.Tests/Fineage.Zone.Tests.csproj --configuration Release --verbosity normal --filter FullyQualifiedName~RegionParallelWorldTests

  load-test-smoke:
    name: load-test-smoke
    if: >-
      ${{ github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.base_ref == 'main') ||
          (github.event_name == 'pull_request' && github.base_ref == 'dev' &&
            contains(github.event.pull_request.labels.*.name, 'perf')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fineage
          POSTGRES_PASSWORD: fineage
          POSTGRES_DB: fineage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fineage -d fineage"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FINEAGE_DATABASE_URL: >-
        Host=127.0.0.1;Port=5432;Database=fineage;Username=fineage;Password=fineage
      CI_LOAD_TEST_SIEGE: '0'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Fineage.Backend.slnx

      - name: Make smoke script executable
        run: chmod +x scripts/ci-load-test-smoke.sh

      - name: Load test smoke (100 bots, workers 0 and 4)
        run: timeout 25m ./scripts/ci-load-test-smoke.sh

      - name: Upload load-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-smoke
          path: local-logs/ci-load-smoke/
          retention-days: 14

      - name: Summarize metrics
        if: always()
        run: |
          if [ -f local-logs/ci-load-smoke/summary.json ]; then
            echo '### Load test smoke' >> "$GITHUB_STEP_SUMMARY"
            cat local-logs/ci-load-smoke/summary.json >> "$GITHUB_STEP_SUMMARY"
          fi