# Shared Release test job with CI Postgres (P1-14). Used by build-and-test and deploy.
name: dotnet-test-with-postgres

on:
  workflow_call:
    inputs:
      verbosity:
        description: dotnet test --verbosity
        type: string
        default: normal

jobs:
  test:
    name: dotnet-test-with-postgres
    runs-on: ubuntu-latest
    # The solution run includes Slow tests. RegionParallelStressTests
    # Parallel_and_sequential_runs_are_identical_under_soak_scale_churn deadlocks
    # inside the 24-player enter loop and used to hold this job until the six-hour
    # runner cap. Blame names the test; the job cap is the backstop.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fineage
          POSTGRES_PASSWORD: fineage
          POSTGRES_DB: fineage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fineage -d fineage"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FINEAGE_DATABASE_URL: >-
        Host=127.0.0.1;Port=5432;Database=fineage;Username=fineage;Password=fineage
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Fineage.Backend.slnx

      # Category=perf already runs in zone-simulation-perf with
      # ParallelizeTestCollections=false. Running those timing gates here
      # (full slnx, parallel collections, shared runner) is noisy: this job
      # failed Debug_tick_p99_with_many_ai_driven_characters at p99=236 ms
      # (p50=0.30) on promotion PR #1136, while zone-simulation-perf passed.
      # Category=Load has its own workflows. Slow and Integration stay here.
      - name: Test
        run: >-
          dotnet test Fineage.Backend.slnx
          --configuration Release
          --verbosity ${{ inputs.verbosity }}
          --filter "Category!=perf&Category!=Load"
          --blame-hang
          --blame-hang-timeout 15m
          --blame-hang-dump-type none
