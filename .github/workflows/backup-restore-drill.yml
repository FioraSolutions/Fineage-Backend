name: backup-restore-drill

# Heavy #987 drill: scheduled + manual only (not on ordinary dev PRs).
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      require_world_entry:
        description: Fail the job when the existing bot smoke cannot enter the restored world
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  drill:
    name: backup-restore-drill
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Fineage.Backend.slnx

      - name: Build stack
        run: |
          dotnet build src/Fineage.Login -c Release -v q
          dotnet build src/Fineage.Zone -c Release -v q
          dotnet build tools/Fineage.LoadTest -c Release -v q

      - name: Disposable backup/restore drill
        env:
          FINEAGE_BUILD_CONFIGURATION: Release
          FINEAGE_DRILL_SKIP_BUILD: '1'
          FINEAGE_DRILL_REQUIRE_SMOKE: ${{ inputs.require_world_entry && '1' || '0' }}
          FINEAGE_BACKUP_RETENTION_DAYS: '14'
          FINEAGE_BACKUP_RETENTION_COUNT: '7'
        run: ./scripts/restore-drill.sh

      - name: Upload drill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-restore-drill-report
          path: |
            local-logs/backup-restore-drill/**/report.md
            local-logs/backup-restore-drill/**/report.json
            local-logs/backup-restore-drill/**/*.log
            local-logs/backup-restore-drill/**/migrate-plan.txt
            local-logs/backup-restore-drill/**/loadtest/report.md
            local-logs/backup-restore-drill/**/loadtest/report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove drills that contain a local database copy
        if: always()
        run: rm -rf local-backups
